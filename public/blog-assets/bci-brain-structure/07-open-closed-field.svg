<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540">
  <rect width="1080" height="540" rx="16" fill="#f4f6f8"/>
  <style>
    text { font-family: "PingFang SC","Hiragino Sans GB","Noto Sans SC","Source Han Sans SC",sans-serif; fill: #1c2430; }
    .title { font-size: 20px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 650; }
    .small { font-size: 13px; fill: #3d4b5c; }
    .muted { font-size: 12px; fill: #5c6b7a; }
  </style>
  <text x="36" y="40" class="title">细胞排成一排，远处的电位才加得起来</text>
  <text x="36" y="64" class="muted">开放电场与远处抵消。依据 Buzsáki、Anastassiou 与 Koch，2012。</text>
  <rect x="36" y="96" width="490" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="128" class="label">新皮层 · 开放电场</text>
  <g fill="#1d4ed8">
    <rect x="80" y="190" width="8" height="80"/>
    <rect x="120" y="190" width="8" height="80"/>
    <rect x="160" y="190" width="8" height="80"/>
    <rect x="200" y="190" width="8" height="80"/>
    <rect x="240" y="190" width="8" height="80"/>
  </g>
  <text x="280" y="190" class="small">锥体细胞平行排列</text>
  <text x="280" y="214" class="small">突触电流方向一致</text>
  <text x="280" y="248" class="small">头皮、硬膜外仍能看见</text>
  <text x="56" y="320" class="small">EEG、MEG、ECoG 主要来自这类细胞。</text>
  <text x="56" y="344" class="small">星形树突的中间神经元贡献很小。</text>
  <rect x="550" y="96" width="490" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="570" y="128" class="label">核团，以及卷起来的海马</text>
  <circle cx="760" cy="230" r="48" fill="none" stroke="#6d28d9" stroke-width="2"/>
  <g fill="#6d28d9">
    <rect x="756" y="190" width="8" height="28"/>
    <rect x="790" y="214" width="8" height="28" transform="rotate(70 794 228)"/>
    <rect x="770" y="250" width="8" height="28" transform="rotate(140 774 264)"/>
    <rect x="724" y="230" width="8" height="28" transform="rotate(-50 728 244)"/>
  </g>
  <text x="820" y="210" class="small">局部场电位可以很大</text>
  <text x="820" y="234" class="small">远处正负相消</text>
  <text x="570" y="320" class="small">头皮 EEG 几乎看不见海马。</text>
  <text x="570" y="344" class="small">要读它，电极得放进内侧颞叶。</text>
  <text x="36" y="420" class="small">右图的放射状是教学用的极端画法。海马是卷起来的古皮层，局部仍有整齐的锥体细胞。</text>
  <text x="36" y="446" class="small">抵消发生在离开这片结构之后。所以海马的 theta、尖波可以很强，头皮上仍然没有对应的一张清晰图。</text>
  <text x="36" y="482" class="small">Hampson 等（2018）的记忆编码实验，刺激加在已经放到 CA1 的深部电极上，用的是这名被试自己的 CA3–CA1 发放模式。</text>
  <text x="36" y="516" class="muted">那是癫痫监测电极上的概念验证，不是一枚长期记忆植入物的临床试验。</text>
</svg>
