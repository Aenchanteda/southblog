ct x="192.0" y="430" width="116" height="36" rx="8" fill="#e8eef8" stroke="#334155" stroke-width="1.5"/><text x="250.0" y="454" text-anchor="middle" class="label">糖的 1′</text><line x1="835.4" y1="278.9" x2="835.4" y2="448" stroke="#b45309" stroke-width="2.5"/><rect x="777.4" y="448" width="116" height="36" rx="8" fill="#e8eef8" stroke="#334155" stroke-width="1.5"/><text x="835.4" y="472" text-anchor="middle" class="label">糖的 1′</text><circle cx="250.0" cy="292.0" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="250.0" y="297.0" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">N1</text><circle cx="196.3" cy="261.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="196.3" y="266.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">C2</text><circle cx="196.3" cy="199.0" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text x="196.3" y="204.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">N3</text><circle cx="250.0" cy="168.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="250.0" y="173.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">C4</text><circle cx="303.7" cy="199.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="303.7" y="204.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">C5</text><circle cx="303.7" cy="261.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="303.7" y="266.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">C6</text><circle cx="679.8" cy="185.0" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text x="679.8" y="190.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">N1</text><circle cx="679.8" cy="243.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="679.8" y="248.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">C2</text><circle cx="730.0" cy="272.0" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text x="730.0" y="277.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">N3</text><circle cx="780.2" cy="243.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="780.2" y="248.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">C4</text><circle cx="780.2" cy="185.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="780.2" y="190.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">C5</text><circle cx="730.0" cy="156.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="730.0" y="161.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">C6</text><circle cx="835.4" cy="167.1" r="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/><text x="835.4" y="172.1" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">N7</text><circle cx="869.5" cy="214.0" r="18" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="869.5" y="219.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2430">C8</text><circle cx="835.4" cy="260.9" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="835.4" y="265.9" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">N9</text><line x1="663.8" y1="185.0" x2="590" y2="185.0" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="4 3"/><text x="590" y="168" class="small" fill="#1d4ed8">这个 N1</text><text x="590" y="188" class="small" fill="#1d4ed8">参与氢键</text><text x="263" y="500" text-anchor="middle" class="label">单环。接糖的氮是 N1。</text><text x="263" y="528" text-anchor="middle" class="small muted">环上还有氮 N3，它不接糖。</text><text x="777" y="536" text-anchor="middle" class="label">双环。接糖的氮是 N9。</text><text x="777" y="564" text-anchor="middle" class="small muted">N1、N3、N7 都是环上的氮，不接糖。</text><text x="520" y="624" text-anchor="middle" class="small muted">糖上的碳写成 1′。碱基上的 N1、N9 不加撇号，两者不是同一个原子。</text></svg>
